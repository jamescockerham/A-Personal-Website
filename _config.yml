title: James Cockerham
description: Self-taught homelab builder in Lexington, Kentucky.
url: https://james.cockerh.am
plugins:
  - jekyll-seo-tag
markdown: kramdown
kramdown:
  input: GFM
exclude: [README.md]
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: blog
    values:
      layout: blog
  - scope:
      path: ""
      type: blog_qr
    values:
      layout: blog_qr
      sitemap: false
# Telegram username without the @ (e.g. telegram: someuser). Leave empty to hide the link.
telegram: jamescockerham
collections:
  blog:
    output: true
    permalink: /b/:slug/
  blog_qr:
    output: true
    permalink: /b/:slug/qr/
