<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  {% seo %}
  <link rel="alternate" type="application/atom+xml" title="James Cockerham · Journal" href="/journal/feed.xml">
  <link rel="stylesheet" href="/assets/style.css?v=20261013">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="wrap" aria-label="Main">
      <a href="/" class="logo"><span class="prompt">~/</span>james</a>
      <ul>
        <li><a href="/homelab/"{% if page.url == "/homelab/" %} aria-current="page"{% endif %}>Homelab</a></li>
        <li><a href="/projects/"{% if page.url == "/projects/" %} aria-current="page"{% endif %}>Projects</a></li>
        <li><a href="/journal/"{% if page.url contains "/journal/" %} aria-current="page"{% endif %}>Journal</a></li>
        <li><a href="/about/"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a></li>
      </ul>
    </nav>
  </header>
  <main id="main" class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>James Cockerham · Lexington, Kentucky</p>
      <p><a href="https://github.com/jamescockerham">GitHub</a> · <a href="https://x.com/JamesCockerham">X</a> ·{% if site.telegram %} <a href="https://t.me/{{ site.telegram }}">Telegram</a> ·{% endif %} <a href="https://cockerh.am">Cockerham family research</a></p>
    </div>
  </footer>
</body>
</html>
