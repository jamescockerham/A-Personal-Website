<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  {% seo %}
  <link rel="stylesheet" href="/assets/style.css?v=20261023">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="wrap" aria-label="Main">
      <a href="/" class="logo"><span class="prompt">~/</span>james</a>
      <ul>
        <li><a href="/b/"{% if page.url contains "/b/" %} aria-current="page"{% endif %}>Blog</a></li>
        <li><a href="/about/"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a></li>
      </ul>
    </nav>
  </header>
  <main id="main" class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>James Cockerham · Lexington, Kentucky</p>
      <p>{% if site.telegram %}<a href="https://t.me/{{ site.telegram }}">Telegram</a>{% endif %}</p>
    </div>
  </footer>
</body>
</html>
